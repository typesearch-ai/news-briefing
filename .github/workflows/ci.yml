name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # typesearch-js: from npm once it is there; until then, its public repository built next to this one.
      - run: bash .github/scripts/install.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # With the fictional sample data: the build renders the full page without any key.
      - run: npm run build
        env:
          DEMO_MOCK: '1'
